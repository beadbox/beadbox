name: Install Smoke
# beadbox-z3j: the run name carries the tag it smoke-tests. A workflow_run run
# reports main's head_sha and head_branch, so this is how the release
# workflow finds the smoke run of a given rc. A DISPATCHED Release reports the
# dispatching branch as head_branch; its tag is its display title (release.yml
# run-name).
run-name: Install Smoke ${{ github.event.inputs.tag || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.display_title) || github.event.workflow_run.head_branch || 'latest' }}

# Cross-platform install-and-smoke (P5.6 / bb-x6lg.6).
#
# Downloads the signed release artifact for each platform, installs it on
# that platform's GitHub-hosted runner, launches the bundled app, and runs
# the GUI gates from src-tauri/scripts/p4-verification-rubric.md (the
# durable rubric codified by bb-un5c.5 / P4.5). Gate numbers follow the
# rubric:
#
#   Gate 1 — capability-error-zero (parse Tauri log file for permission/
#            capability errors; assert count = 0)
#   Gate 3 — 1000-event subscription burst (bd create loop; assert all
#            events arrive in order within 30s). DISABLED, see the step.
#   Gate 4 — clean process exit within 500ms (SIGTERM / WM_CLOSE; ps grep
#            shows no orphans)
#
# Platforms: macOS ARM64 runs on every release. Windows is present but
# disabled (`if: false`, pending bb-m4h2). There is no Linux job: it was
# opt-in only and never wired to launch the .deb, so it was deleted
# (beadbox-clu, from beadbox-3vx). Gate 2 (a WKWebView-vs-Chromium visual
# diff) was deleted with it: its reference screenshot never landed, so it
# skipped on every run and never checked anything.
#
# Security note: every shell `run:` block reads tag-derived data via the
# job-level env: block (TAG=$SMOKE_TAG / $env:TAG) — never via direct
# ${{ ... }} interpolation inside run scripts — so a malicious tag name
# cannot inject shell commands. The only ${{ ... }} use inside steps is
# in if: conditionals and `with:` arguments to actions.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke-test (e.g., v0.25.0-rc.1). Defaults to latest published."
        required: false
        type: string
      smoke_macos_arm64:
        description: "Smoke macOS ARM64"
        type: boolean
        default: true
      smoke_macos_x64:
        description: "Smoke macOS x64 (disabled: no runners; mirrors release.yml convention)"
        type: boolean
        default: false
      smoke_windows:
        description: "Smoke Windows"
        type: boolean
        default: true
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: install-smoke-${{ github.event.inputs.tag || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.display_title) || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Resolve which tag to smoke. workflow_run gives us head_branch only on
  # a successful release; workflow_dispatch may pass an explicit tag; the
  # fallback for either-empty is "the latest published release".
  # ─────────────────────────────────────────────────────────────────────
  resolve-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    # beadbox-2tp: deliberately NOT gated on the Release run's conclusion.
    # Smoke validates the ARTIFACTS. Whether some other job in that run
    # succeeded is a different question, and gating on the run conclusion let
    # an unrelated failure disable the launch gate: on the v0.26.0-rc.1 cut,
    # update-rc-cask failed for a missing secret while updating a DEV cask,
    # which set the run to failure, which skipped this job, which skipped
    # every platform job, which the aggregate then reported green.
    # If the release genuinely produced nothing, resolve fails loudly below —
    # that is a red gate, not a skipped one.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
      WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
      WORKFLOW_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Read tag-derived data from env: never from a GitHub Actions
          # expression directly in shell, to avoid any injection risk if
          # a tag name contains shell metacharacters. (The literal
          # double-curly form is omitted on purpose: GitHub Actions
          # parses every expression inside a run: block regardless of
          # leading '#', and an unparseable example would HTTP 422 the
          # workflow at dispatch time. See bb-x6lg.6 QA bounce.)
          # A tag-push Release reports its tag as head_branch. A dispatched one
          # reports the branch it was dispatched from (main), and carries its tag
          # as the display title instead (release.yml run-name, beadbox-z3j).
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "${WORKFLOW_RUN_EVENT:-}" = "workflow_dispatch" ]; then
            TAG="$WORKFLOW_RUN_TITLE"
          else
            TAG="${WORKFLOW_RUN_BRANCH:-}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag resolved (no input + no published releases)"; exit 1
          fi
          # Sanity: tag should be a vN.N.N(-rc.N) shape. Refuse anything
          # else so a deliberately-crafted tag can't be processed.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Resolved tag '$TAG' does not match expected v* shape; refusing"; exit 1 ;;
          esac
          echo "Resolved smoke tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # macOS ARM64 — capability log, 1000-event burst, clean exit.
  # ─────────────────────────────────────────────────────────────────────
  smoke-macos-arm64:
    needs: resolve-tag
    # mac-runner guard (beadbox-449.4): accident prevention only; a fork's PR runs its own copy, so forks are stopped by the approval rule, not this.
    # After a Release (workflow_run, which always runs main's copy of this file)
    # or a dispatch on main, and only when the dispatch did not opt macOS out.
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'workflow_dispatch' || github.event.inputs.smoke_macos_arm64 == 'true') }}
    runs-on: [beadbox-macos-release]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Start from an empty workspace (self-hosted Mac)
        # beadbox-449.6: the long-lived fleet Mac reuses the job's workspace;
        # a hosted runner starts each job fresh, and so must this one, or a
        # previous job's files survive a checkout (Build 40791169447).
        if: runner.environment != 'github-hosted'
        # As strict as the threat: an unset or empty value, a path outside the
        # runner's own _work, _work itself, or a symlink resolving elsewhere is
        # refused; paths are compared after realpath, with no globs.
        run: |
          set -euo pipefail
          ws=${GITHUB_WORKSPACE:-}
          if [ -z "$ws" ]; then echo "::error::GITHUB_WORKSPACE is unset or empty; refusing"; exit 1; fi
          work=$(cd "$HOME/actions-runner/_work" && pwd -P)
          if [ ! -e "$ws" ] && [ ! -L "$ws" ]; then echo "OK: no workspace yet at $ws"; exit 0; fi
          real=$(realpath "$ws")
          rest=${real#"$work"/}
          if [ "$rest" = "$real" ] || [ -z "$rest" ] || [ "$real" = "$work" ]; then
            echo "::error::refusing to empty '$ws' (resolves to '$real', not strictly under '$work')"
            exit 1
          fi
          find "$real" -mindepth 1 -delete
          left=$(ls -A "$real")
          if [ -n "$left" ]; then echo "::error::workspace could not be emptied"; exit 1; fi
          echo "OK: workspace emptied: $real"
      - name: Sparse checkout (helpers + reference screenshot only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            src-tauri/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Pinned gh for this job
        # beadbox-449.6: the fleet Mac's job PATH has no gh. This workflow runs
        # on workflow_run, so no GITHUB_PATH write: the download step puts the
        # pinned dir first on its own PATH instead.
        id: gh
        uses: ./.github/actions/pinned-gh

      - name: Install bd CLI
        # Gate 3 drives `bd create` against the running app. The runner starts
        # with no bd of its own, so install it rather than probing for it.
        # beadbox-449.5: a pinned, checksum-verified release into this job's
        # $RUNNER_TEMP, not brew: the Mac runner's user is not an admin and
        # must not use another account's Homebrew.
        env:
          BD_VERSION: "1.3.1"
          # sha256 of beads_1.3.1_darwin_arm64.tar.gz, as in the release's checksums.txt.
          BD_SHA256: "508ba807996e2b9c992c538a6f405f2fc7d2e16cf8b4e5b0d1bf9fe860367007"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/beads.tgz" \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_darwin_arm64.tar.gz"
          echo "$BD_SHA256  $RUNNER_TEMP/beads.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/beads.tgz" -C "$RUNNER_TEMP/bin" ./bd
          # bd stays in $RUNNER_TEMP/bin and is called by path (no $GITHUB_PATH write: zizmor github-env on a workflow_run workflow).
          "$RUNNER_TEMP/bin/bd" version

      - name: Download release DMG and extract the .app
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pinned gh first, then the system dirs only (beadbox-449.6).
          PATH: ${{ steps.gh.outputs.dir }}:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -euo pipefail
          # This used to fetch 'Beadbox-app-arm64.tar.gz'. That asset is an
          # INTERMEDIATE: build-macos-arm64 uploads it purely so create-arm64-dmg
          # can pull the signed .app across jobs, and cleanup-arm64-tarball then
          # deletes it from the release. Install Smoke triggers on workflow_run
          # AFTER Release finishes, so the asset was always already gone by the
          # time this ran — the download could never have succeeded on that path.
          #
          # The DMG is durable (one of the three artifacts check-promote
          # validates), and it is what a user actually installs, so smoking it
          # also exercises the DMG's own signature and staple.
          #
          # beadbox-449.5: everything lives under this job's $RUNNER_TEMP. The
          # Mac this runs on is shared (the QA Mac), so the smoke never touches
          # /Applications/Beadbox.app or any app it did not start.
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE/dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Beadbox-*-macOS-arm64.dmg' --dir "$SMOKE/dmg"
          DMG=$(ls "$SMOKE"/dmg/Beadbox-*-macOS-arm64.dmg | head -1)
          [ -n "$DMG" ] || { echo "::error::no macOS arm64 DMG found on $TAG"; exit 1; }
          echo "Smoking $DMG"
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          # Copy the app out before detaching; the mountpoint is read-only.
          mkdir -p "$SMOKE/install"
          cp -R "$MOUNT/Beadbox.app" "$SMOKE/install/"
          hdiutil detach "$MOUNT"
          echo "app=$SMOKE/install/Beadbox.app" >> "$GITHUB_OUTPUT"
          ls -la "$SMOKE/install/Beadbox.app/Contents/MacOS"

      - name: Verify the app before anything runs it
        env:
          SMOKE_APP: ${{ steps.fetch.outputs.app }}
        # beadbox-449.5: the bundle is a downloaded artifact about to run on a
        # shared Mac. It must be intact, accepted by Gatekeeper (signed and
        # notarized), and signed by our team; anything else stops here.
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$SMOKE_APP"
          spctl --assess --type execute --verbose=2 "$SMOKE_APP"
          TEAM=$(codesign -dv --verbose=2 "$SMOKE_APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          if [ "$TEAM" != "K7Z8YKVA8G" ]; then
            echo "::error::Beadbox.app is signed by team '$TEAM', not K7Z8YKVA8G; refusing to run it"
            exit 1
          fi
          echo "OK: signature intact, Gatekeeper accepts it, team $TEAM"

      - name: Launch app
        id: launch
        env:
          SMOKE_APP: ${{ steps.fetch.outputs.app }}
        run: |
          set -euo pipefail
          # Gate 1 counts errors from THIS launch only. The log dir is the
          # runner user's own and may hold earlier runs: record each file's
          # size now and read only what is written after, never delete it.
          LOG_DIR="$HOME/Library/Logs/Beadbox"
          mkdir -p "$LOG_DIR"
          : > "$RUNNER_TEMP/smoke/log-offsets"
          for f in "$LOG_DIR"/*; do
            [ -f "$f" ] && printf '%s\t%s\n' "$(stat -f %z "$f")" "$f" >> "$RUNNER_TEMP/smoke/log-offsets"
          done
          open -n "$SMOKE_APP"
          # This launch's own process: its executable path is unique to this
          # job's $RUNNER_TEMP, and it belongs to this user.
          APP_PID=""
          for _ in $(seq 1 30); do
            APP_PID=$(pgrep -U "$(id -u)" -f "^$SMOKE_APP/Contents/MacOS/beadbox\$" | head -1 || true)
            [ -n "$APP_PID" ] && break
            sleep 1
          done
          [ -n "$APP_PID" ] || { echo "::error::Beadbox process not running after launch"; exit 1; }
          echo "pid=$APP_PID" >> "$GITHUB_OUTPUT"
          # Allow Tauri/sidecar to boot + write initial log lines.
          sleep 6
          kill -0 "$APP_PID" || { echo "::error::Beadbox ($APP_PID) exited after launch"; exit 1; }
          echo "launched $SMOKE_APP as pid $APP_PID"

      - name: "Gate 1 — capability-error-zero"
        run: |
          set -euo pipefail
          LOG_DIR="$HOME/Library/Logs/Beadbox"
          # Only what this launch wrote: each file from its recorded size on,
          # and files that did not exist before the launch in full.
          NEW="$RUNNER_TEMP/smoke/this-launch.log"
          : > "$NEW"
          for f in "$LOG_DIR"/*; do
            [ -f "$f" ] || continue
            off=$(awk -F'\t' -v f="$f" '$2 == f {print $1}' "$RUNNER_TEMP/smoke/log-offsets")
            tail -c +"$(( ${off:-0} + 1 ))" "$f" >> "$NEW"
          done
          # Match: permission denied / not allowed / capability denied / capability missing.
          # Forgiving regex per p4-verification-rubric.md.
          # The `|| true` must be INSIDE the pipeline. grep exits 1 on no match —
          # the passing case — and under `set -o pipefail` that failure propagates
          # even though `wc` already printed 0. A trailing `|| echo 0` then appends
          # a SECOND line, making MATCHES "0\n0", which is != "0", so the gate
          # failed on clean logs and dirty ones alike. `wc -l` on empty input
          # already yields 0, so nothing here is needed for the value itself.
          MATCHES=$( { grep -iE 'permission denied|not allowed|capability|permission' "$NEW" 2>/dev/null || true; } | wc -l | tr -d ' ' )
          echo "Capability error matches: $MATCHES"
          if [ "$MATCHES" != "0" ]; then
            echo "::error::Gate 1 failed — $MATCHES capability/permission log lines (expected 0)"
            grep -iE 'permission denied|not allowed|capability|permission' "$NEW" || true
            exit 1
          fi

      - name: "Gate 3 — 1000-event subscription burst"
        # Disabled (beadbox-01f.2): it times 1000 sequential `bd create` calls (bd's speed, 249-355s on runners since v0.26.2), not Beadbox event delivery; the rewrite is proposed on beadbox-01f.2.
        if: false
        run: |
          set -euo pipefail
          bash src-tauri/scripts/install-smoke-helpers/burst-bd-create.sh

      - name: "Gate 4 — clean process exit within 500ms"
        env:
          SMOKE_APP: ${{ steps.fetch.outputs.app }}
          APP_PID: ${{ steps.launch.outputs.pid }}
        run: |
          set -euo pipefail
          # beadbox-449.5: only this launch's processes. The app pid recorded at
          # launch, the processes it started (the sidecar), and anything whose
          # command line holds this job's own app path. Never a process found
          # by name: the shared Mac may be running other copies of Beadbox.
          ours() {
            { echo "$APP_PID"
              pgrep -P "$APP_PID" || true
              pgrep -U "$(id -u)" -f "$SMOKE_APP/" || true
            } | sort -u | while read -r p; do kill -0 "$p" 2>/dev/null && echo "$p"; done
          }
          CHILDREN=$(pgrep -P "$APP_PID" || true)
          # Quit by SIGTERM to this launch's processes only. No AppleScript:
          # on an unattended Mac session an Apple Event to the app can wait on
          # a consent prompt nobody answers, and by name or bundle id it could
          # reach another copy (beadbox-449.2 test).
          for p in $APP_PID $CHILDREN; do kill -TERM "$p" 2>/dev/null || true; done
          # 500ms grace.
          sleep 0.5
          # Same pipefail defect as Gate 1: count lines, never pgrep's exit code.
          LEFT=$(ours; for p in $CHILDREN; do kill -0 "$p" 2>/dev/null && echo "$p"; done)
          STRAGGLERS=$(printf '%s\n' "$LEFT" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          if [ "$STRAGGLERS" != "0" ]; then
            echo "::error::Gate 4 failed — $STRAGGLERS of this launch's process(es) still running after 500ms"
            printf '%s\n' "$LEFT" | sed '/^$/d' | sort -u | while read -r p; do ps -o pid=,ppid=,command= -p "$p" || true; done
            # Force-kill this launch's processes so the runner is clean for the next run.
            printf '%s\n' "$LEFT" | sed '/^$/d' | sort -u | while read -r p; do kill -KILL "$p" 2>/dev/null || true; done
            exit 1
          fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-macos-arm64-logs
          path: |
            ~/Library/Logs/Beadbox/
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Windows x86_64 — capability log, 1000-event burst, clean exit.
  # ─────────────────────────────────────────────────────────────────────
  smoke-windows:
    needs: resolve-tag
    # Disabled per Nelson directive 2026-04-26 — re-enable when Windows debugging resumes
    if: false  # disabled: Windows debugging paused (bb-m4h2 / bun CWD issue)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Sparse checkout (helpers only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            src-tauri/scripts
          sparse-checkout-cone-mode: false

      - name: Install bd CLI
        # Hosted runners have no bd. Pull the release zip rather than scoop
        # (no bucket) — version pinned; bump BD_VERSION to move it.
        shell: pwsh
        env:
          BD_VERSION: "1.2.2"
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command bd -ErrorAction SilentlyContinue)) {
            $zip = "$env:RUNNER_TEMP\beads.zip"
            $dir = "$env:RUNNER_TEMP\beads"
            Invoke-WebRequest -Uri "https://github.com/gastownhall/beads/releases/download/v$env:BD_VERSION/beads_${env:BD_VERSION}_windows_amd64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $bd = Get-ChildItem -Path $dir -Recurse -Filter "bd.exe" | Select-Object -First 1
            if (-not $bd) { throw "bd.exe not found in the beads release zip" }
            $bd.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "$($bd.DirectoryName);$env:PATH"
          }
          bd version

      - name: Download release .msi
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path _smoke | Out-Null
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --pattern '*.msi' --dir _smoke
          Get-ChildItem _smoke

      - name: Install .msi (silent)
        shell: pwsh
        run: |
          $msi = Get-ChildItem _smoke\*.msi | Select-Object -First 1
          Write-Host "Installing $($msi.FullName)"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$($msi.FullName)`"", "/qn", "/L*v", "_smoke\install.log" -Wait
          Get-Content _smoke\install.log -Tail 20

      - name: Launch app
        shell: pwsh
        run: |
          $logDir = "$env:APPDATA\Beadbox\logs"
          if (Test-Path "$env:APPDATA\Beadbox") { Remove-Item -Recurse -Force "$env:APPDATA\Beadbox" }
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $exe = Get-ChildItem -Path "$env:PROGRAMFILES\Beadbox\Beadbox.exe", "$env:LOCALAPPDATA\Programs\Beadbox\Beadbox.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "Beadbox.exe not found after install"; exit 1 }
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 8
          $proc = Get-Process Beadbox -ErrorAction SilentlyContinue
          if (-not $proc) { Write-Error "Beadbox process not running after launch"; exit 1 }

      - name: "Gate 1 — capability-error-zero"
        shell: pwsh
        run: |
          $logDir = "$env:APPDATA\Beadbox\logs"
          $matches = Select-String -Path "$logDir\*" -Pattern 'permission denied|not allowed|capability|permission' -CaseSensitive:$false -ErrorAction SilentlyContinue
          $count = if ($matches) { $matches.Count } else { 0 }
          Write-Host "Capability error matches: $count"
          if ($count -ne 0) {
            Write-Error "Gate 1 failed — $count capability/permission log lines (expected 0)"
            $matches | ForEach-Object { Write-Host $_.Line }
            exit 1
          }

      - name: "Gate 3 — 1000-event subscription burst"
        # Disabled (beadbox-01f.2): it times 1000 sequential `bd create` calls (bd's speed, 249-355s on runners since v0.26.2), not Beadbox event delivery; the rewrite is proposed on beadbox-01f.2.
        if: false
        shell: bash
        run: |
          set -euo pipefail
          bash src-tauri/scripts/install-smoke-helpers/burst-bd-create.sh

      - name: "Gate 4 — clean process exit within 500ms"
        shell: pwsh
        run: |
          Get-Process Beadbox -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Get-Process beadbox-sidecar -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          $stragglers = Get-Process Beadbox, beadbox-sidecar -ErrorAction SilentlyContinue
          if ($stragglers) {
            Write-Error "Gate 4 failed — $($stragglers.Count) process(es) still running after 500ms"
            $stragglers | Format-Table -AutoSize
            $stragglers | Stop-Process -Force -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-windows-logs
          path: |
            ${{ env.APPDATA }}\Beadbox\logs\
            _smoke\install.log
          if-no-files-found: warn
          retention-days: 14


  # ─────────────────────────────────────────────────────────────────────
  # Aggregate — convenience job for branch protection. Fails iff any
  # platform job failed. Acceptable for the "two consecutive green runs"
  # acceptance criterion: green here on two runs in a row = bb-x6lg.6 done.
  # ─────────────────────────────────────────────────────────────────────
  install-smoke:
    needs: [resolve-tag, smoke-macos-arm64, smoke-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate
        env:
          RESOLVE: ${{ needs.resolve-tag.result }}
          MACOS: ${{ needs.smoke-macos-arm64.result }}
          WINDOWS: ${{ needs.smoke-windows.result }}
          EVENT: ${{ github.event_name }}
          INPUT_MACOS: ${{ github.event.inputs.smoke_macos_arm64 }}
        run: |
          set -euo pipefail
          echo "resolve-tag: $RESOLVE"
          echo "macos-arm64: $MACOS"
          echo "windows:     $WINDOWS"
          echo "event:       $EVENT"

          # beadbox-2tp: "skipped" means two different things and they must not
          # be collapsed. A job skipped because an operator turned it off is a
          # pass. A job skipped because something upstream broke means the thing
          # this gate exists to check was never checked — that is a failure.
          # The old aggregate accepted `success|skipped` for every job, so an
          # all-skipped run reported green over an empty run, which is worse
          # than having no gate: a missing gate is known to be missing.
          FAILED=0

          # resolve-tag has no opt-out toggle. If it did not succeed, no
          # platform job had a tag to test and nothing ran at all.
          if [ "$RESOLVE" != "success" ]; then
            echo "::error::resolve-tag did not succeed (result: $RESOLVE) — no artifacts were smoke-tested"
            FAILED=1
          fi

          # macOS is the only platform with no legitimate skip on a release
          # run: its `if:` opts out only when a workflow_dispatch explicitly
          # sets smoke_macos_arm64=false. Any other skip is upstream breakage.
          case "$MACOS" in
            success) ;;
            skipped)
              if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_MACOS" = "false" ]; then
                echo "macos-arm64 skipped by explicit dispatch opt-out — allowed"
              else
                echo "::error::smoke-macos-arm64 was SKIPPED without an explicit opt-out — the launch gate did not run"
                FAILED=1
              fi
              ;;
            *)
              echo "::error::smoke-macos-arm64 result: $MACOS"
              FAILED=1
              ;;
          esac

          # Windows may legitimately skip: smoke-windows is `if: false` pending
          # bb-m4h2. A FAILURE is still fatal.
          for name in WINDOWS; do
            eval "r=\${$name}"
            case "$r" in
              success|skipped) ;;
              *) echo "::error::smoke-$name result: $r"; FAILED=1 ;;
            esac
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::install-smoke aggregate FAILED — the release is not smoke-validated"
            exit 1
          fi
          echo "install-smoke aggregate passed: macOS validated the artifacts"

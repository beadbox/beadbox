name: Dependency audit

# beadbox-l5i.5 AC-4: dependency audit.
#
# Gates on VULNERABILITIES in what we actually ship. Deliberately not a
# "zero advisories anywhere" gate — Nelson's 2026-08-20 descope defers the
# moderate/low tail and dev-only tooling to beadbox-l5i.7, and a gate that
# is red for reasons nobody intends to act on gets ignored, then rots.
#
# Rust  — cargo-deny, config in src-tauri/deny.toml (licenses + advisories
#         + bans + sources). Every accepted advisory is listed there with
#         its reasoning, so an unlisted one fails the build.
# JS    — bun audit at --audit-level=high. The --ignore entries below are
#         each dev-only-by-dependency-path; see the comment on each.
#
# beadbox-mol-vsl: this job used to run in Quality
# Gates on every push (16-41 s). Advisories arrive by time, not by commit, so
# the nightly run below is the real gate; on push and PR it runs only when a
# manifest or lockfile changed, the one case a commit can break a license or a
# ban. Every other push pays nothing for it. The checks are unchanged.
#
# Security note: no ${{ github.event.* }} fields in run: blocks; the
# concurrency group uses github.ref and github.sha, both GitHub-controlled.

on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
      - packages/*/package.json
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/deny.toml
      - .github/workflows/dependency-audit.yml
  pull_request:
    branches: [main]
    # The same list as push: a PR that changes no manifest runs no audit.
    paths:
      - bun.lock
      - package.json
      - packages/*/package.json
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/deny.toml
      - .github/workflows/dependency-audit.yml
  schedule:
    # Nightly, unfiltered: new advisories against an unchanged lockfile.
    - cron: "41 5 * * *"
  workflow_dispatch:

# As in Quality Gates (beadbox-3fp4): each push to main keeps its own run.
concurrency:
  group: dependency-audit-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: "Dependency audit (licenses + high-severity advisories)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03; toolchain chosen via input
        with:
          toolchain: stable

      - name: Install cargo-deny
        # Version pinned deliberately (public-repo supply-chain hygiene);
        # bump CARGO_DENY_VERSION to move it. This tarball nests its binary
        # one directory deep, unlike the cargo-llvm-cov one.
        env:
          CARGO_DENY_VERSION: "0.20.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xzf - -C "$HOME/.cargo/bin" --strip-components=1 \
                "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny --version

      - name: cargo-deny (licenses, advisories, bans, sources)
        working-directory: src-tauri
        run: cargo deny check

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: bun audit (high severity)
        # Each --ignore below was classified by DEPENDENCY PATH, not by
        # guessing from the package name. None of these parents ships:
        #   fast-uri                   <- @stryker-mutator/core   (dev: mutation testing)
        #   nanoid, postcss, vite      <- vite toolchain          (dev: build)
        #   ws                         <- happy-dom               (dev: test DOM)
        #   braces (GHSA-vfj7-8cjw-p6xm) <- chokidar@3 <- @tanstack/router-cli
        #                                 + @tanstack/router-plugin (dev: route
        #     generation). No fixed release exists (3.0.3, the latest, is
        #     affected), and the input is our own route-file globs. The way out
        #     is the router family's move to chokidar ^5 (beadbox-9lp).
        # brace-expansion, seroval, source-map-js and undici are not ignored:
        # the root package.json overrides them to fixed versions (beadbox-9lp).
        # On ws specifically: kkrpc (a real production dep) lists ws only as a
        # peerDependency and we do not install it, so kkrpc does NOT pull ws
        # into the shipped tree — the only ws in the graph comes from
        # happy-dom. Verified, not assumed.
        # All deferred to beadbox-l5i.7 per Nelson's 2026-08-20 descope.
        run: |
          set -euo pipefail
          bun audit --audit-level=high \
            --ignore=GHSA-7p8r-x3mc-p8w7 --ignore=GHSA-v2hh-gcrm-f6hx \
            --ignore=GHSA-4c8g-83qw-93j6 --ignore=GHSA-q3j6-qgpj-74h6 \
            --ignore=GHSA-v39h-62p7-jpjc \
            --ignore=GHSA-28wg-ghj8-5hjv --ignore=GHSA-2v37-7h3g-55p8 \
            --ignore=GHSA-6g55-p6wh-862q --ignore=GHSA-r28c-9q8g-f849 \
            --ignore=GHSA-fx2h-pf6j-xcff \
            --ignore=GHSA-vfj7-8cjw-p6xm \
            --ignore=GHSA-96hv-2xvq-fx4p

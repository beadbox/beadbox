# Quality-discipline enforcement (bb-ystl epic).
#
# Single workflow housing the per-domain quality gates the spec calls
# for. Combined surface bb-ystl.2 (Tier 2 coverage + CCN + Rust mutation)
# + bb-ystl.3 (TS mutation via Stryker on Bun command-runner).
#
# Tier 1 (pre-push hook): lint + typecheck + the test suite
# (.husky/pre-push). Fast feedback before the network round-trip.
#
# The CCN complexity gate and the cargo-mutants Rust mutation gate were
# deleted (beadbox-clu, Nelson ruling 2026-09-12): the first was red on
# every push for pre-existing functions, the second caught 0 of 22 mutants
# within its time budget. Neither carried signal.
#
# Tier 2 (this workflow):
#   - coverage-server / coverage-client: enforce coverage floors: server
#     60 / client 20 lines. The src-tauri Rust floor (65 lines) runs nightly
#     in nightly.yml's coverage-rust (beadbox-mol-0zm).
#     THIS FILE IS THE SOURCE OF TRUTH for those numbers. The failure
#     messages used to cite a "spec §2 Q1" that does not exist — a fossil of
#     the pruned private quality-discipline doc, not pm/spec.md. pm ruled
#     (beadbox-l5i.6.4) to drop the citations rather than create a floors
#     section, because duplicating enforcement numbers into a doc recreates
#     the drift it is meant to prevent, and a red PR citing a nonexistent
#     section actively misleads the contributor reading it. Each message
#     already states the floor and the measured value, which is the useful
#     part. CONTRIBUTING.md points here.
#   - mutation-server: Stryker on Bun via command-runner (bb-ystl.3 /
#     QD.3); narrow initial scope (handlers/console.ts) because
#     fixture-based suites don't survive Stryker's sandbox copy
#     without extra fixture wiring. See
#     docs/quality/2026-04-27/mutation/server-baseline.md for the
#     failure mode + scope-expansion plan. Floor: 60% on this scope.
#   - mutation-client: NOT GATED yet; tracked for QD.6 ratchet.
#
# Tier 3 (quarterly audit): owned by QD.6, not in CI.
#
# Gates apply to PRs landing AFTER QD.2 lands (per epic narrative
# posture). Prior v0.25 RC commits are NOT retroactively re-gated.
#
# Security note: this workflow uses no ${{ github.event.* }} fields
# in run: blocks. Concurrency uses ${{ github.ref }} which is GitHub-
# controlled and safe.

name: Quality Gates

on:
  pull_request:
    branches: [main, v0.25]
  push:
    branches: [main, v0.25]
  workflow_dispatch:

# beadbox-3fp4: every push to main gets its own complete run, so a later push
# never cancels an earlier commit's proof; the group is keyed per commit there.
# PRs, other branches and manual runs keep one group per ref, where a newer
# run still supersedes the in-flight one. github.sha, like github.ref, is
# GitHub-controlled.
concurrency:
  group: quality-gates-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

# beadbox-l5i.1: read-only default for GITHUB_TOKEN. No job in this workflow
# writes to the repo; any future one must opt in with its own permissions: block.
permissions:
  contents: read

jobs:
  coverage-server:
    name: Coverage — packages/server (floor 60% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install bd (beads CLI)
        # beadbox-l5i.1 / qa1: the retired homelab runner had bd installed;
        # hosted runners do not, so ~10 server tests died on
        # 'Executable not found in $PATH: "bd"' and the coverage floor was
        # never reached. Installed rather than mocked on purpose: the failing
        # suites (bd-argv / bd-callsites security tests, bd-workspace fixture,
        # subscribe leak gate) exist to assert behaviour against a REAL cobra
        # CLI — mocking bd would delete the property beadbox-l5i.3 added.
        # Version pinned; bump BD_VERSION to move it.
        env:
          BD_VERSION: "1.3.1"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz" \
            | tar xzf - -C "$HOME/.local/bin" bd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bd" version
      - run: bun install --frozen-lockfile
      - name: Run server coverage
        run: |
          set -o pipefail
          bun --cwd=packages/server test --timeout=30000 --coverage 2>&1 | tee coverage-server.txt
      - name: Enforce 60% line floor
        run: |
          # Bun's coverage table prints "All files | <funcs%> | <lines%> | ...";
          # extract the line% column (3rd pipe-delimited field of the All-files row).
          PCT=$(awk -F'|' '/^[[:space:]]*All files/{gsub(/[[:space:]]/,"",$3); print $3}' coverage-server.txt)
          if [ -z "$PCT" ]; then
            echo "::error::Could not parse server coverage from coverage-server.txt"
            exit 1
          fi
          echo "packages/server line coverage: $PCT%"
          AWK_PASS=$(awk -v p="$PCT" 'BEGIN{print (p+0 >= 60.0) ? "1" : "0"}')
          if [ "$AWK_PASS" != "1" ]; then
            echo "::error::packages/server coverage $PCT% below floor 60.0%"
            echo "::error::See artifact 'coverage-server' for per-file breakdown."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-server
          path: coverage-server.txt
          retention-days: 14

  coverage-client:
    name: Coverage — packages/client (floor 20% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run client coverage (includes QD.1 import sweep)
        run: |
          set -o pipefail
          bun --cwd=packages/client test --timeout=30000 --coverage 2>&1 | tee coverage-client.txt
      - name: Enforce 20% line floor
        run: |
          PCT=$(awk -F'|' '/^[[:space:]]*All files/{gsub(/[[:space:]]/,"",$3); print $3}' coverage-client.txt)
          if [ -z "$PCT" ]; then
            echo "::error::Could not parse client coverage from coverage-client.txt"
            exit 1
          fi
          echo "packages/client line coverage: $PCT%"
          AWK_PASS=$(awk -v p="$PCT" 'BEGIN{print (p+0 >= 20.0) ? "1" : "0"}')
          if [ "$AWK_PASS" != "1" ]; then
            echo "::error::packages/client coverage $PCT% below floor 20.0% (post-QD.1 re-baseline)"
            echo "::error::See artifact 'coverage-client' for per-file breakdown."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-client
          path: coverage-client.txt
          retention-days: 14

  mutation-server:
    # bb-ystl.3 / QD.3: Stryker on Bun via command-runner against
    # packages/server. Initial scope intentionally narrow (handlers/
    # console.ts) — fixture-based suites don't survive Stryker's
    # sandbox copy without extra fixture wiring. See
    # docs/quality/2026-04-27/mutation/server-baseline.md for the
    # scope-expansion plan. Floor 60% on this scope.
    name: Mutation — packages/server (Stryker, narrow scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install Node (Stryker host runtime)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install
      - name: Run Stryker
        working-directory: packages/server
        run: bun run quality:mutation
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report-server
          path: packages/server/reports/mutation/mutation-report.html
          if-no-files-found: ignore

  # beadbox-mol-31o: lint and both typechecks on every push and PR, under 30 s
  # per job. They used to run only in Build's build-frontend, beside a Linux
  # cargo check --release, and Build leaves the push run (the cargo check runs
  # nightly with it). As one job they measured 21, 25 and 31 s on three main
  # pushes; over 30 s means split, not accept, so the client typecheck (the
  # slow step, 8-13 s) runs in a job of its own and lint rides with the server
  # typecheck.
  typecheck-client:
    name: Typecheck — packages/client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck packages/client
        run: bun --cwd=packages/client run typecheck

  lint-typecheck-server:
    name: Lint (both packages) and typecheck packages/server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck packages/server
        run: bun --cwd=packages/server run typecheck

  # ────────────────────────────────────────────────────────────────────
  # beadbox-l5i.1: workflow hygiene. Standing enforcement for the
  # open-sourcing CI-security decisions in pm/opensource-checklist.md §3,
  # so they cannot silently rot back in after launch:
  #
  #   1. no homelab runner labels  — a fork PR must never execute code on
  #      the LAN. This is the launch blocker the bead exists for.
  #   2. no fork-triggered workflow event that carries base-repo secrets
  #   3. every `uses:` pinned to a 40-hex commit SHA (tags are mutable)
  #   4. actionlint clean
  #   5. zizmor clean — Actions-specific static analysis (template
  #      injection, artifact poisoning, excessive permissions)
  #
  # NOTE for future editors: the banned tokens are assembled at runtime
  # from fragments rather than written out literally, because these checks
  # scan .github/ — including this file. Spelling either token out in full
  # anywhere below makes the job fail on itself.
  # ────────────────────────────────────────────────────────────────────
  workflow-hygiene:
    name: "Workflow hygiene (runners, SHA pins, actionlint, zizmor)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runners are GitHub-hosted Linux/Windows, and macOS is the fleet's Mac only
        # beadbox-449 (Nelson, 2026-10-28): every macOS job runs on the fleet's
        # own Mac at .207 (label beadbox-macos-release), never on GitHub's
        # hosted macOS. Every runs-on, matrix os values included, is a hosted
        # Linux/Windows label or that one self-hosted label, and the label may
        # appear only in the workflows listed in MAC_FILES. Supersedes
        # beadbox-5p1's single release.yml route. This check guards against
        # accidents in our own files; a fork pull request runs its own copy of
        # them, so the barrier for forks is the external-contributor approval
        # rule, not this step.
        run: |
          set -euo pipefail
          HOSTED='^(ubuntu-latest|ubuntu-2[0-9]\.04(-arm)?|windows-latest|windows-20[0-9]{2})$'
          MAC_LABEL='beadbox-macos-release'
          MAC_RUNS_ON="[$MAC_LABEL]"
          MAC_FILES=' .github/workflows/install-smoke.yml .github/workflows/packaged-smoke.yml .github/workflows/release.yml '
          MATRIX_MAC_FILES=' .github/workflows/install-script.yml '
          # Split so Actions does not evaluate this as an expression here.
          MATRIX='$''{{ matrix.os }}'
          bad=0
          mac=0
          while IFS=: read -r file line val; do
            val=$(printf '%s' "$val" | sed -E 's/^[[:space:]]*runs-on:[[:space:]]*//; s/[[:space:]]+$//')
            if [[ "$val" =~ $HOSTED ]]; then continue; fi
            if [ "$val" = "$MATRIX" ]; then continue; fi # values checked below
            if [ "$val" = "$MAC_RUNS_ON" ] && [[ "$MAC_FILES" == *" $file "* ]]; then
              mac=$((mac + 1))
              continue
            fi
            echo "::error file=$file,line=$line::runs-on '$val' is neither a hosted Linux/Windows label nor $MAC_RUNS_ON in a listed Mac workflow"
            bad=1
          done < <(grep -rnE '^[[:space:]]*runs-on:' .github/workflows/)
          while IFS=: read -r file line val; do
            list=$(printf '%s' "$val" | sed -nE 's/^[[:space:]]*os:[[:space:]]*\[(.*)\][[:space:]]*$/\1/p')
            if [ -z "$list" ]; then
              echo "::error file=$file,line=$line::matrix os must be a one-line [list] of runner labels"
              bad=1
              continue
            fi
            IFS=, read -ra items <<< "$list"
            for item in "${items[@]}"; do
              item=$(printf '%s' "$item" | tr -d " \"'")
              if [[ "$item" =~ $HOSTED ]]; then continue; fi
              if [ "$item" = "$MAC_LABEL" ] && [[ "$MATRIX_MAC_FILES" == *" $file "* ]]; then
                mac=$((mac + 1))
                continue
              fi
              echo "::error file=$file,line=$line::matrix os '$item' is neither a hosted Linux/Windows label nor $MAC_LABEL in a listed Mac workflow"
              bad=1
            done
          done < <(grep -rnE '^[[:space:]]*os:' .github/workflows/ || true)
          # The macOS jobs: install-smoke, packaged-smoke, release (2), and
          # install-script's matrix entry (build-arm-dmg and rust-cache-warm
          # were retired, beadbox-449.6).
          if [ "$mac" -ne 5 ]; then
            echo "::error::expected 5 macOS jobs on $MAC_LABEL, found $mac (a Mac job moved, was added, or lost its label: update MAC_FILES and this count together)"
            bad=1
          fi
          # No GitHub-hosted macOS label anywhere under .github/, comments
          # included (beadbox-449 AC3). The patterns are split so this step
          # does not match itself.
          if grep -rnE 'macos-''(1[0-9]|2[0-9]|latest)' .github/; then
            echo "::error::a GitHub-hosted macOS label appears under .github/ (every macOS job runs on $MAC_LABEL)"
            bad=1
          fi
          [ "$bad" -eq 0 ]
          echo "OK: hosted Linux/Windows runners, and $mac macOS jobs on $MAC_LABEL only"

      - name: Every macOS job carries its guard
        # beadbox-449.4: each job that can reach the fleet's Mac carries a
        # job-level guard admitting only the runs that Mac is for. ACCIDENT
        # PREVENTION ONLY: a fork's pull request runs its own copy of these
        # files; forks are stopped by the external-contributor approval rule.
        # Rules: the job holds the guard marker and its own `if:`; in
        # release.yml that `if:` requires the mac-admission job; a matrix
        # that lists the Mac label excludes it off main.
        run: |
          set -euo pipefail
          MARK='mac-runner guard (beadbox-449.4)'
          bad=0
          found=0
          # One file per job block: from "  <id>:" to the next job or the file end.
          rm -rf "$RUNNER_TEMP/jobs"; mkdir -p "$RUNNER_TEMP/jobs"
          for f in .github/workflows/*.yml; do
            d="$RUNNER_TEMP/jobs/$(basename "$f")"; mkdir -p "$d"
            awk -v out="$d" '
              /^jobs:/ { injobs = 1; next }
              injobs && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ { n++; id = $1; sub(":", "", id) }
              injobs && n { print > (out "/" sprintf("%03d", n) "-" id) }
            ' "$f"
            for job in "$d"/*; do
              [ -f "$job" ] || continue
              name="$f:$(basename "$job" | cut -d- -f2-)"
              # Real YAML keys only (anchored): a job-level runs-on, or a matrix os list.
              grep -qE '^    runs-on:[[:space:]]*\[beadbox-macos-release\]|^[[:space:]]+os:[[:space:]]*\[[^]]*beadbox-macos-release' "$job" || continue
              found=$((found + 1))
              if ! grep -qF "$MARK" "$job"; then echo "::error file=$f::$name names the Mac runner without the guard marker"; bad=1; fi
              if grep -qE '^[[:space:]]+os:[[:space:]]*\[[^]]*beadbox-macos-release' "$job"; then
                if ! grep -qF "github.ref != 'refs/heads/main'" "$job" || ! grep -qE "^[[:space:]]+exclude:" "$job"; then
                  echo "::error file=$f::$name lists the Mac runner in its matrix without excluding it off main"; bad=1
                fi
              elif ! grep -qE '^    if:' "$job"; then
                echo "::error file=$f::$name runs on the Mac runner without a job-level if: guard"; bad=1
              elif [ "$f" = .github/workflows/release.yml ] && ! grep -qF "needs.mac-admission.result == 'success'" "$job"; then
                echo "::error file=$f::$name runs on the Mac runner without requiring the mac-admission job"; bad=1
              fi
            done
          done
          if [ "$found" -ne 5 ]; then
            echo "::error::expected 5 macOS jobs to check, found $found"
            bad=1
          fi
          [ "$bad" -eq 0 ]
          echo "OK: all $found macOS jobs carry their guard (accident prevention only)"

      - name: The macOS smokes touch only their own launch
        # beadbox-449.5: the macOS smokes may run on a shared Mac (the QA Mac,
        # which also hosts another project's runner). No kill by name, no
        # AppleScript at all (by name or bundle id it reaches other copies, and
        # on an unattended session it can hang on a consent prompt), no write
        # to the installed /Applications copy, in the files that drive them.
        # Comment lines are skipped; the patterns are split so this step does
        # not match itself.
        run: |
          set -euo pipefail
          FILES=".github/workflows/install-smoke.yml .github/workflows/packaged-smoke.yml scripts/packaged-smoke.sh"
          bad=0
          # shellcheck disable=SC2086 # FILES is a word list on purpose
          if grep -nE 'pk''ill|kill''all|osa''script|tell applic''ation|(rm|cp|mv|ditto)[^#]*/Applic''ations/Beadbox' $FILES \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::a macOS smoke reaches beyond its own launch (see the lines above)"
            bad=1
          fi
          [ "$bad" -eq 0 ]
          echo "OK: the macOS smokes stop only their own processes and never touch the installed app"

      - name: Self-hosted Mac PATH and toolchain trust tests
        # beadbox-449.4: the root-hook design (job-started hook, picker,
        # supervisor) is retired; what remains is the PATH and toolchain trust
        # check the signing job runs, and release.yml's per-job toolchain.
        run: bash scripts/ci-runner/test-runner-path.sh

      - name: No fork-triggered workflows with secret access
        run: |
          set -euo pipefail
          PATTERN="pull_request""_target"
          if grep -rn "$PATTERN" .github/workflows/; then
            echo "::error::Found $PATTERN. It runs fork-authored code with this repo's secrets — use pull_request instead."
            exit 1
          fi
          echo "OK: no $PATTERN"

      - name: All actions pinned to a commit SHA
        run: |
          set -euo pipefail
          # A tag is mutable: whoever controls an action's repo can repoint
          # v4 at new code. A 40-hex commit SHA cannot be repointed.
          # Local (./...) and container (docker://...) refs are exempt.
          grep -rhoE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]]+' .github/workflows/ \
            | sed -E 's/^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*//' \
            | grep -vE '^(\./|docker://)' \
            | grep -vE '@[0-9a-f]{40}$' \
            | sort -u > /tmp/unpinned.txt || true
          if [ -s /tmp/unpinned.txt ]; then
            echo "::error::These action references are not pinned to a 40-character commit SHA:"
            sed 's/^/  /' /tmp/unpinned.txt
            exit 1
          fi
          echo "OK: every action reference is SHA-pinned"

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # The gate enforces workflow security, not shell style. Drop
          # shellcheck's info/style advice on the pre-existing release
          # scripts; real warnings still fail. See .github/actionlint.yaml.
          SHELLCHECK_OPTS: "--severity=warning"
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xzf - -C /tmp actionlint
          /tmp/actionlint -color

      - name: zizmor
        env:
          ZIZMOR_VERSION: "1.29.0"
          # zizmor resolves action refs via the GitHub API; the read-only
          # default token keeps it off the unauthenticated rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          # --min-severity=high: gate on the classes that actually get repos
          # compromised (template injection, dangerous triggers, artifact and
          # cache poisoning). Every high finding we have accepted is listed
          # with its reasoning in .github/zizmor.yml; an unlisted one fails.
          zizmor --min-severity=high --config .github/zizmor.yml \
            --format=plain .github/workflows/

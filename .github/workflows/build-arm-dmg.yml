name: Build ARM64 DMG

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build from (default: main)"
        required: false
        type: string
        default: main

concurrency:
  group: build-arm-dmg
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

# beadbox-l5i.1: read-only default for GITHUB_TOKEN. This workflow only
# uploads run artifacts (which needs no repo write), so no job opts up.
permissions:
  contents: read

jobs:
  build:
    # beadbox-l5i.6.1: signing secrets are scoped to the `release` environment,
    # whose ref policy allows only v* tags and main. A job must declare the
    # environment to read them, and a fork PR's head ref matches neither, so a
    # fork-triggered run cannot reach these secrets even if it reaches this job.
    environment: release
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_id=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03; toolchain chosen via input
        with:
          toolchain: stable

      - name: Install dependencies and setup sidecar
        # `bash <script>` rather than `./<script>` so the call does not depend
        # on the executable bit surviving checkout.
        run: |
          bun install --frozen-lockfile
          bash src-tauri/scripts/copy-sidecar.sh

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Build SPA
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_BUILD_TAG: ${{ steps.version.outputs.version }}
          VITE_BUILD_ID: ${{ steps.version.outputs.build_id }}
          VITE_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_ENV_ID: ${{ secrets.POSTHOG_ENV_ID }}
        # bb-alpa: post-Bun-migration SPA build invocation per
        # pm/systemdesign.md §5.1. Root package.json is a monorepo manifest
        # with no top-level build script; the SPA build lives in
        # packages/client.
        run: bun --cwd=packages/client run build

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Word splitting is intended: the substitution yields the existing
          # keychain paths as separate arguments to append to the search list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm "$CERT_PATH"

      - name: Materialize Apple API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          # GitHub-hosted runners have no ~/.appstoreconnect; materialize the
          # notarization .p8 from a secret. Robust to both raw-PEM and base64
          # secret storage; tries APPLE_API_KEY_P8 then APPLE_API_KEY_CONTENT.
          # Same form as release.yml's macOS jobs — keep the two in sync.
          mkdir -p private_keys
          # beadbox-l5i.2: the Key ID comes from a secret rather than being
          # inlined. Fail loudly if it is unset — an empty value would build
          # "AuthKey_.p8" and surface much later as an opaque notarization
          # error.
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is not set}"
          KEY="private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          write_key() {
            printf '%s' "$1" | grep -q "BEGIN PRIVATE KEY" && { printf '%s\n' "$1" > "$KEY"; } || { printf '%s' "$1" | base64 --decode > "$KEY" 2>/dev/null || return 1; }
            grep -q "BEGIN PRIVATE KEY" "$KEY"
          }
          write_key "$APPLE_API_KEY_P8" || write_key "$APPLE_API_KEY_CONTENT" || { echo "::error::could not materialize a valid .p8 from APPLE_API_KEY_P8 or APPLE_API_KEY_CONTENT"; exit 1; }
          echo "Materialized $(wc -c < "$KEY" | tr -d ' ') byte .p8"

      - name: Build .app, sign, and notarize
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Nelson Melo Rodriguez (K7Z8YKVA8G)"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          RUST_LOG: tauri_bundler=debug
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # beadbox-l5i.6.1: createUpdaterArtifacts is OFF for this workflow.
          # tauri.conf.json enables it globally, which makes the bundler demand
          # TAURI_SIGNING_PRIVATE_KEY — a key this workflow does not have and
          # should not be given. This is a DMG-builder helper that publishes
          # nothing, so it has no need to emit signed updater artifacts, and
          # handing it the update-signing key would widen exposure of the one
          # key that can forge an update to every installed client, for zero
          # functional gain. release.yml legitimately sets that key because it
          # actually publishes updates.
          bunx tauri build --bundles app --config '{"build":{"beforeBuildCommand":"true"},"version":"'"$VERSION"'","bundle":{"createUpdaterArtifacts":false}}'

      - name: Locate build output
        id: paths
        run: echo "bundle_dir=src-tauri/target/release/bundle" >> "$GITHUB_OUTPUT"

      - name: Verify signing
        run: |
          APP="${{ steps.paths.outputs.bundle_dir }}/macos/Beadbox.app"
          CODESIGN_OUT=$(codesign --display --verbose=2 "$APP" 2>&1) || true
          echo "$CODESIGN_OUT"
          echo "$CODESIGN_OUT" | grep -q "Developer ID Application" || { echo "::error::Signing verification failed"; exit 1; }
          STAPLER_OUT=$(xcrun stapler validate "$APP" 2>&1) || true
          echo "$STAPLER_OUT"
          echo "$STAPLER_OUT" | grep -q "worked" || { echo "::error::Staple verification failed"; exit 1; }

      - name: Package signed app for transfer
        # bb-mhh1.1: ditto's PKZip output gets double-wrapped by
        # actions/upload-artifact@v4's own zip layer, which corrupts
        # code-signed Mach-O binaries on the round-trip (sidecar's
        # __LINKEDIT signature data goes missing → unpack fails). tar
        # preserves Mach-O extended attributes cleanly through the
        # double-wrap. Mirrors the proven-working tar.gz form
        # release.yml's create-arm64-dmg job uses.
        run: |
          APP="${{ steps.paths.outputs.bundle_dir }}/macos/Beadbox.app"
          tar -czf Beadbox-app-arm64.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"

      - name: Restore keychain search list
        if: always()
        run: security list-keychains -d user -s ~/Library/Keychains/login.keychain-db

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-arm64
          path: Beadbox-app-arm64.tar.gz
          retention-days: 1

  create-dmg:
    needs: [build]
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download signed app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-arm64

      - name: Unpack signed app
        # bb-mhh1.1: tar -xzf preserves Mach-O extended attributes
        # (code signatures) that ditto's PKZip path corrupts via
        # actions/upload-artifact's double-wrap. See Package step in
        # the build job above for the full root-cause comment.
        run: tar -xzf Beadbox-app-arm64.tar.gz

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING=$(mktemp -d)
          cp -R Beadbox.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "Beadbox" -srcfolder "$STAGING" \
            -ov -format UDZO -imagekey zlib-level=9 \
            "Beadbox_${VERSION}_aarch64.dmg"
          rm -rf "$STAGING"

      - name: Fix DMG Applications icon
        continue-on-error: true
        # bash prefix so the call doesn't depend on the script's executable bit.
        run: |
          DMG_SRC=$(ls Beadbox_*_aarch64.dmg | head -1)
          bash scripts/fix-dmg-dsstore.sh "$DMG_SRC"

      - name: Prepare release artifact
        id: artifact
        env:
          # Via env:, not ${{ }} inline — a dispatch input interpolated into a
          # run: block is expanded by the runner before bash sees it, so its
          # contents would execute as shell (zizmor template-injection).
          INPUT_REF: ${{ inputs.ref }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_SRC=$(ls Beadbox_*_aarch64.dmg | head -1)
          DMG_NAME="Beadbox-${VERSION}-macOS-arm64.dmg"
          mv "$DMG_SRC" "$DMG_NAME"
          SHA=$(shasum -a 256 "$DMG_NAME" | cut -d' ' -f1)
          echo "dmg=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **DMG:** ${DMG_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256:** ${SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** ${INPUT_REF}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-arm64
          path: ${{ steps.artifact.outputs.dmg }}
          retention-days: 7

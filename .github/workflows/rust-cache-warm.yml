name: Rust cache warm (macOS)

# beadbox-5p1: release builds run on tags, and a tag-triggered run can only
# restore caches saved by its own tag or by the default branch. Every release
# therefore compiled the whole Rust dependency tree cold (2.5-3.5 min on
# GitHub's hosted macOS). This workflow builds the same release profile on main and saves
# the cache under the exact key the release job's macOS build restores
# (shared-key macos-arm64, same pinned actions, same toolchain, same env), so a
# tag compiles only the app crate.
#
# Only dependencies are cached (rust-cache never caches workspace crates), so
# the placeholder sidecar and SPA below cannot leak into a release: the app
# crate, which embeds the real SPA and version, is always rebuilt by the
# release job itself.
#
# beadbox-mol-wmu: daily and on dispatch only, never on a push (main's push
# run is the fast gate). The nightly Build's macOS job saves the same key from
# main too; a tag after a same-day src-tauri change pays at most one cold
# compile of what changed.
#
# No secrets and no environment: this job signs nothing.
on:
  schedule:
    # Daily: picks up a new stable toolchain (part of the key) before the next
    # tag, and keeps the entry clear of the 7-day unused-cache eviction.
    # beadbox-449: 08:47 UTC is inside the .207 Mac's macOS window, 02:00-06:00
    # ET in both EDT and EST (07:00-10:00 UTC), and after the nightly Build's
    # macOS job (07:41), so the runner serves one beadbox job at a time.
    - cron: "47 8 * * *"
  workflow_dispatch:

concurrency:
  group: rust-cache-warm
  cancel-in-progress: true

# Must match release.yml's workflow-level RUST_BACKTRACE: rust-cache hashes
# CARGO_* and RUST* variables into the cache key.
env:
  RUST_BACKTRACE: 1
  HUSKY: "0"

permissions:
  contents: read

jobs:
  warm-macos-arm64:
    runs-on: [beadbox-macos-release]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master 2026-09-03; toolchain chosen via input
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Placeholder sidecar and SPA
        # tauri-build requires the externalBin to exist and generate_context!
        # requires frontendDist; neither affects the cached dependencies.
        run: |
          mkdir -p src-tauri/binaries packages/client/dist
          touch src-tauri/binaries/beadbox-sidecar-aarch64-apple-darwin
          printf '<!doctype html><title>cache warm</title>\n' > packages/client/dist/index.html

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release profile (no bundle)
        # Same cargo invocation as release.yml's `tauri build --bundles app`
        # (tauri passes the same features either way), minus bundling/signing.
        run: bunx tauri build --no-bundle --config '{"build":{"beforeBuildCommand":"true"}}'

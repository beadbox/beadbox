name: Packaged smoke (macOS)

# Launches the built Beadbox.app on a macOS runner and checks it from the
# outside: sidecar boot, the UI's handshake, the tree load, a live update from
# the bd CLI, a clean quit with nothing left running, and the updater
# manifest plus its signature (beadbox-rgc). Details in
# scripts/packaged-smoke.sh.
#
# It needs no secrets and no write access. For a published release it
# downloads the release's own updater bundle (which is the .app) and
# latest.json. release.yml calls it before publishing, when those assets are
# still on a draft: it then stages them as the workflow artifact named by
# `artifact`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose macOS app to test (e.g. v0.27.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      artifact:
        description: "Workflow artifact holding a draft's Beadbox_aarch64.app.tar.gz and latest.json"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    name: Packaged app smoke (macOS arm64, ${{ matrix.tag }})
    # mac-runner guard (beadbox-449.4): accident prevention only; a fork's PR runs its own copy, so forks are stopped by the approval rule, not this.
    # Direct dispatch on main or a release branch, or called by release.yml on a
    # release tag push or a release-branch dispatch (its mac-admission job has
    # already checked that branch).
    if: >-
      (github.event_name == 'workflow_dispatch'
        && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: [beadbox-macos-release]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(format('["{0}"]', inputs.tag)) }}
    env:
      TAG: ${{ matrix.tag }}
    steps:
      - name: Start from an empty workspace (self-hosted Mac)
        # beadbox-449.6: the long-lived fleet Mac reuses the job's workspace;
        # a hosted runner starts each job fresh, and so must this one, or a
        # previous job's files survive a checkout (Build 40791169447).
        if: runner.environment != 'github-hosted'
        # As strict as the threat: an unset or empty value, a path outside the
        # runner's own _work, _work itself, or a symlink resolving elsewhere is
        # refused; paths are compared after realpath, with no globs.
        run: |
          set -euo pipefail
          ws=${GITHUB_WORKSPACE:-}
          if [ -z "$ws" ]; then echo "::error::GITHUB_WORKSPACE is unset or empty; refusing"; exit 1; fi
          work=$(cd "$HOME/actions-runner/_work" && pwd -P)
          if [ ! -e "$ws" ] && [ ! -L "$ws" ]; then echo "OK: no workspace yet at $ws"; exit 0; fi
          real=$(realpath "$ws")
          rest=${real#"$work"/}
          if [ "$rest" = "$real" ] || [ -z "$rest" ] || [ "$real" = "$work" ]; then
            echo "::error::refusing to empty '$ws' (resolves to '$real', not strictly under '$work')"
            exit 1
          fi
          find "$real" -mindepth 1 -delete
          left=$(ls -A "$real")
          if [ -n "$left" ]; then echo "::error::workspace could not be emptied"; exit 1; fi
          echo "OK: workspace emptied: $real"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Staged draft assets
        if: inputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/staged

      - name: Download the app (the release's updater bundle)
        env:
          STAGED: ${{ inputs.artifact != '' }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          if [ "$STAGED" = "true" ]; then
            cp "$RUNNER_TEMP/staged/Beadbox_aarch64.app.tar.gz" "$RUNNER_TEMP/app.tar.gz"
          else
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Beadbox_aarch64.app.tar.gz" -o "$RUNNER_TEMP/app.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/app.tar.gz" -C "$RUNNER_TEMP/app"
          ls "$RUNNER_TEMP/app"

      - name: Install bd and minisign
        # beadbox-449.5: pinned, checksum-verified releases into this job's
        # $RUNNER_TEMP, not brew: the Mac runner's user is not an admin and
        # must not use another account's Homebrew.
        env:
          BD_VERSION: "1.3.1"
          # sha256 of beads_1.3.1_darwin_arm64.tar.gz, as in the release's checksums.txt.
          BD_SHA256: "508ba807996e2b9c992c538a6f405f2fc7d2e16cf8b4e5b0d1bf9fe860367007"
          MINISIGN_VERSION: "0.12"
          # sha256 of minisign-0.12-macos.zip (the zip holds one binary, `minisign`).
          MINISIGN_SHA256: "89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/beads.tgz" \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_darwin_arm64.tar.gz"
          echo "$BD_SHA256  $RUNNER_TEMP/beads.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/beads.tgz" -C "$RUNNER_TEMP/bin" ./bd
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/minisign.zip" \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-macos.zip"
          echo "$MINISIGN_SHA256  $RUNNER_TEMP/minisign.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/minisign.zip" minisign -d "$RUNNER_TEMP/bin"
          chmod 755 "$RUNNER_TEMP/bin/minisign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bd" --version
          "$RUNNER_TEMP/bin/minisign" -v

      - name: Smoke test
        env:
          STAGED: ${{ inputs.artifact != '' }}
          # The release's own repository (a fork or sandbox publishes its own
          # assets and latest.json).
          SMOKE_REPO: ${{ github.repository }}
        run: |
          if [ "$STAGED" = "true" ]; then
            export SMOKE_MANIFEST="$RUNNER_TEMP/staged/latest.json"
            export SMOKE_BUNDLE="$RUNNER_TEMP/staged/Beadbox_aarch64.app.tar.gz"
          fi
          bash scripts/packaged-smoke.sh "$RUNNER_TEMP/app/Beadbox.app" "$TAG" "$RUNNER_TEMP/smoke-out"

      - name: Upload log and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-smoke-${{ matrix.tag }}
          path: ${{ runner.temp }}/smoke-out
          if-no-files-found: warn

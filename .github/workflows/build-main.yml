name: Build (nightly)

# beadbox-5yv: main produces signed, notarized macOS + Linux artifacts, so a
# release promotes an existing build (beadbox-z3j) instead of compiling at
# release time. Build mode never creates a tag, draft or release; its output
# is the Actions artifact beadbox-build-<sha> (30-day retention).
#
# beadbox-mol-06k: nightly and on dispatch only, never on a push to main
# (main's push run is the fast gate). A tag still builds through release.yml
# directly. Promotion resolves a validated rc, not a main build, so it loses
# no input.
#
# TODO(beadbox-5yv, D2): also build rc/** branches. Blocked until the
# `release` environment's branch policy admits rc/* (today: main + v* tags),
# a secrets/environments settings change that is Nelson's call.

on:
  schedule:
    # 07:41 UTC, nightly: off the hour, inside the .207 Mac's macOS window
    # (02:00-06:00 ET, 07:00-10:00 UTC in both EDT and EST; beadbox-449), and
    # ahead of rust-cache-warm (08:47).
    - cron: "41 7 * * *"
  # No ref input: a dispatch builds the head of the branch it runs on, and the
  # `release` environment admits main and v* tags only, so its secrets (signing,
  # notarization) never build a commit outside them. A free-form SHA would let a
  # main run sign any commit in the repo, a PR head included.
  workflow_dispatch:

# The called jobs declare contents: write for their release uploads (skipped in
# build mode); a caller must grant at least what the callee's jobs request.
permissions:
  contents: write
  # beadbox-z3j: release.yml's resolve-promotion reads Actions run results
  # (skipped in build mode, but a caller must still grant every permission
  # its callee's jobs request, or GitHub refuses the run at startup).
  actions: read

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      mode: build
      ref: ${{ github.sha }}
    secrets: inherit
